name: test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check shell
        run: |
          bash -n bootstrap-tailcat.sh tests/bootstrap-tailcat-test.sh
          shellcheck -x bootstrap-tailcat.sh tests/bootstrap-tailcat-test.sh
          tests/bootstrap-tailcat-test.sh

  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create unreachable test identity
        run: |
          echo "ROTATED_KEY=nodekey:$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install persistent service (default mode)
        run: cat bootstrap-tailcat.sh | sudo bash -s -- --derp=derp1d.tailscale.com
      - name: Verify persistent service and state
        run: |
          set -x
          test "$(systemctl show tailcat-ssh --property=User --value)" = "$(id -un)"
          test "$(systemctl show tailcat-ssh --property=Group --value)" = "$(id -gn)"
          test "$(systemctl is-enabled tailcat-ssh 2>/dev/null || true)" = enabled
          sudo systemctl is-active --quiet tailcat-ssh
          sudo systemd-analyze verify /etc/systemd/system/tailcat-ssh.service
          test "$(systemctl show tailcat-ssh --property=Restart --value)" = on-failure
          test "$(systemctl show tailcat-ssh --property=RuntimeMaxUSec --value)" = infinity
          test "$(systemctl show tailcat-ssh --property=NoNewPrivileges --value)" = no
          test "$(sudo stat --format='%U:%G:%a' /var/lib/tailcat/server.private.json)" = "$(id -un):$(id -gn):600"
          test "$(sudo stat --format='%U:%G:%a' /var/lib/tailcat/token)" = root:root:600
          test "$(sudo stat --format='%U:%G:%a' /var/lib/tailcat/work)" = "$(id -un):$(id -gn):700"
          test "$(sudo cat /var/lib/tailcat/allowed-clients)" = "nodekey:6381fe8fa9c2b67c7d25ded51bde5e39d8c29b55dcd9411a44ba1525ac2f543f"
          test "$(sudo cat /var/lib/tailcat/relay)" = "custom:derp1d.tailscale.com"
          ! getent passwd tailcat-support
          sudo -u "$(id -un)" sudo -n true
          sudo /usr/bin/tailcat parse "$(sudo cat /var/lib/tailcat/token)" >/dev/null
      - name: Rotate client access without changing device identity
        run: |
          before="$(sudo cat /var/lib/tailcat/token)"
          sudo ./bootstrap-tailcat.sh --allow="$ROTATED_KEY" --derp=derp1d.tailscale.com
          after="$(sudo cat /var/lib/tailcat/token)"
          test "$before" = "$after"
          sudo grep --fixed-strings -- "--allow=$ROTATED_KEY" /etc/systemd/system/tailcat-ssh.service
          sudo systemctl is-active --quiet tailcat-ssh
          test "$(systemctl show tailcat-ssh --property=Restart --value)" = on-failure
      - name: Re-run removes a stale legacy key without changing identity
        run: |
          before="$(sudo cat /var/lib/tailcat/token)"
          sudo install -d -m 0700 /root/.config/tailcat/keys
          echo stale-legacy-key | sudo tee /root/.config/tailcat/keys/default.private.json >/dev/null
          sudo ./bootstrap-tailcat.sh --derp=derp1d.tailscale.com
          test ! -e /root/.config/tailcat/keys/default.private.json
          after="$(sudo cat /var/lib/tailcat/token)"
          test "$before" = "$after"
          sudo systemctl is-active --quiet tailcat-ssh
      - name: Temporary support window mode still works
        run: |
          sudo ./bootstrap-tailcat.sh --allow="$ROTATED_KEY" --derp=derp1d.tailscale.com --duration-minutes=5
          test "$(systemctl is-enabled tailcat-ssh 2>/dev/null || true)" != enabled
          test "$(systemctl show tailcat-ssh --property=Restart --value)" = no
          test "$(systemctl show tailcat-ssh --property=RuntimeMaxUSec --value)" != infinity
          sudo systemctl is-active --quiet tailcat-ssh
      - name: Upgrade a v1.0.0 installation
        run: |
          sudo ./bootstrap-tailcat.sh --uninstall
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 60 \
            https://raw.githubusercontent.com/geraldpeng6/tc/bootstrap-v1.0.0/bootstrap-tailcat.sh \
            -o /tmp/bootstrap-v1.0.0.sh
          printf '%s  %s\n' \
            'eb1e229e6564c8c6741be9e89270df31c5a382fc3b8648d1e880f40d39f6e489' \
            /tmp/bootstrap-v1.0.0.sh | sha256sum --check --status -
          sudo bash /tmp/bootstrap-v1.0.0.sh \
            --allow="$ROTATED_KEY" --derp=derp1d.tailscale.com --duration-minutes=5
          before="$(sudo cat /var/lib/tailcat/token)"
          getent passwd tailcat-support
          sudo ./bootstrap-tailcat.sh --derp=derp1d.tailscale.com
          after="$(sudo cat /var/lib/tailcat/token)"
          test "$before" = "$after"
          test "$(systemctl show tailcat-ssh --property=User --value)" = "$(id -un)"
          ! getent passwd tailcat-support
          ! getent group tailcat-support
          sudo systemctl is-active --quiet tailcat-ssh
          test "$(systemctl is-enabled tailcat-ssh 2>/dev/null || true)" = enabled
      - name: Uninstall
        if: always()
        run: |
          sudo ./bootstrap-tailcat.sh --uninstall
          test ! -e /etc/systemd/system/tailcat-ssh.service
          test ! -e /var/lib/tailcat
          id "$(id -un)"
